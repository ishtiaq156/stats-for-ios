name: StatsForIOS
options:
  bundleIdPrefix: com.ishtiaqsyed
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  xcodeVersion: '27.1'
packages:
  ActivityCore:
    path: Packages/ActivityCore
targets:
  Stats:
    type: application
    platform: iOS
    sources: [Apps/Phone]
    dependencies:
      - package: ActivityCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishtiaqsyed.StatsForIOS
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: 3
        INFOPLIST_KEY_CFBundleDisplayName: Stats
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_FILE: Apps/Phone/Info.plist
        SWIFT_VERSION: '5.10'
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
  StatsCompanion:
    type: application
    platform: macOS
    sources: [Apps/Mac]
    dependencies:
      - package: ActivityCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishtiaqsyed.StatsCompanion
        MARKETING_VERSION: '0.3.2'
        CURRENT_PROJECT_VERSION: 5
        INFOPLIST_KEY_CFBundleDisplayName: Stats Companion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_FILE: Apps/Mac/Info.plist
        SWIFT_VERSION: '5.10'
        CODE_SIGN_STYLE: Automatic

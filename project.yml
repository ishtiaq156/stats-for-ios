name: StatsForIOS
options:
  bundleIdPrefix: com.ishtiaqsyed
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  xcodeVersion: '27.2'
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  ActivityCore:
    path: Packages/ActivityCore
targets:
  Stats:
    type: application
    platform: iOS
    sources: [Apps/Phone]
    dependencies:
      - package: ActivityCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishtiaqsyed.StatsForIOS
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: 3
        INFOPLIST_KEY_CFBundleDisplayName: Stats
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_FILE: Apps/Phone/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '6.0'
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
  StatsCompanion:
    type: application
    platform: macOS
    sources: [Apps/Mac]
    dependencies:
      - package: ActivityCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishtiaqsyed.StatsCompanion
        MARKETING_VERSION: '0.3.2'
        CURRENT_PROJECT_VERSION: 5
        INFOPLIST_KEY_CFBundleDisplayName: Stats Companion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_FILE: Apps/Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '6.0'
        CODE_SIGN_STYLE: Automatic
schemes:
  Stats:
    build:
      targets:
        Stats: all
    run:
      config: Debug
  StatsCompanion:
    build:
      targets:
        StatsCompanion: all
    run:
      config: Debug
